name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -A x64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DSLIMEVR_BUILD_TESTS=ON

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel 4

      - name: Test
        shell: bash
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Upload driver
        uses: actions/upload-artifact@v4
        with:
          name: slimevr-openvr-driver-win64
          path: build/driver
          if-no-files-found: error
